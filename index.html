    <!-- Matches the manifest's theme_color; the page opens on the dark hero,

         whether or not the page has been prerendered. The prerender step
         rewrites the four marked lines per route. -->

    <meta property="og:site_name" content="Aura's Digital Dream" />
    <meta property="og:locale" content="ro_RO" />
